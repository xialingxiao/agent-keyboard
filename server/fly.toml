# fly.toml app configuration file generated for mnmlcv-agent on 2026-10-25T11:05:41-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mnmlmxm-agent'
primary_region = 'iad'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  AK_MAX_WORKERS = '3'
  AK_PUBLIC_URL = 'https://agent-keyboard.fly.dev'
  AK_SESSION_IDLE_MS = '45000'
  CLAUDE_MODEL = 'opus'
  CONTEXT_WINDOW_TOKENS = '1000000'
  EMAIL_FROM = 'Agent Keyboard <invites@agentkeyboard.com>'
  FONTCONFIG_FILE = '/data/fontconfig/fonts.conf'
  GIT_AUTHOR_EMAIL = 'agent@agentkeyboard.com'
  GIT_AUTHOR_NAME = 'Agent Keyboard'
  GIT_COMMITTER_EMAIL = 'agent@agentkeyboard.com'
  GIT_COMMITTER_NAME = 'Agent Keyboard'
  GOOGLE_HD_SITES = 'none'
  HOME = '/data'
  IS_SANDBOX = '1'
  NODE_ENV = 'production'
  PORT = '8080'
  TS_EXIT_NODE = '100.86.180.105'

[[mounts]]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
